<div
  (click)="pokemonClick.emit()"
  class="group relative m-3 flex cursor-pointer flex-col items-center overflow-hidden rounded-2xl border border-white/10 bg-linear-to-b from-[#29282e] via-[#1d1c21] to-[#121216] p-4 text-center shadow-lg transition-all duration-300 hover:-translate-y-1 hover:border-purple-400/30 hover:shadow-purple-500/10"
>
  <div
    class="pointer-events-none absolute -top-16 h-40 w-40 rounded-full bg-purple-500/10 blur-3xl transition-all duration-500 group-hover:bg-purple-500/20"
  ></div>

  <div class="absolute left-4 top-3 text-xs font-bold tracking-widest text-gray-500">
    #{{ pokemon()?.id?.toString()?.padStart(3, '0') }}
  </div>

  <div class="relative mt-5 flex h-44 w-full items-center justify-center">
    <div
      class="absolute h-32 w-32 rounded-full bg-white/5 blur-2xl transition-all duration-500 group-hover:bg-purple-400/10"
    ></div>

    <img
      [src]="pokemon()?.sprites?.other?.dream_world?.front_default"
      [alt]="pokemon()?.name"
      class="relative z-10 h-full w-full object-contain drop-shadow-[0_15px_15px_rgba(0,0,0,0.4)] transition-transform duration-300 group-hover:scale-110"
    />
  </div>

  <h2 class="mt-2 text-xl font-bold capitalize tracking-wide text-white">
    {{ pokemon()?.name }}
  </h2>

  <div class="mt-3 flex flex-wrap justify-center gap-2">
    @for (type of pokemon()?.types; track type.slot) {
      <span
        class="rounded-full border border-white/10 bg-white/10 px-3 py-1 text-xs font-semibold capitalize text-gray-200 backdrop-blur-sm"
      >
        {{ type.type.name }}
      </span>
    }
  </div>

  <div class="my-4 h-px w-full bg-white/5"></div>

  <div class="grid w-full grid-cols-2 gap-2">
    <div class="rounded-xl bg-black/20 px-3 py-2 transition-colors group-hover:bg-black/30">
      <p class="text-[10px] font-semibold uppercase tracking-wider text-gray-500">Weight</p>

      <p class="mt-1 text-sm font-bold text-gray-200">
        {{ (pokemon()?.weight ?? 0) / 10 }}
        <span class="text-xs font-normal text-gray-500">kg</span>
      </p>
    </div>

    <div class="rounded-xl bg-black/20 px-3 py-2 transition-colors group-hover:bg-black/30">
      <p class="text-[10px] font-semibold uppercase tracking-wider text-gray-500">Height</p>

      <p class="mt-1 text-sm font-bold text-gray-200">
        {{ (pokemon()?.height ?? 0) / 10 }}
        <span class="text-xs font-normal text-gray-500">m</span>
      </p>
    </div>
  </div>
</div>
