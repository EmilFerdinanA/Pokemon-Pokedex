@if (selectedPokemon(); as pokemon) {
  <app-modal [pokemon]="pokemon" (close)="closeModal()" />
}

<div class="grid grid-cols-5 gap-4">
  @for (pokemon of pokemonsSlice(); track pokemon.id) {
    <app-card [pokemon]="pokemon" (pokemonClick)="openModal(pokemon)" />
  }
</div>

<app-pagination
  [currentPage]="currentPage()"
  [totalPages]="totalPages()"
  (pageChange)="onPageChange($event)"
/>
